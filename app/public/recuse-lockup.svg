<!-- Recuse Protocol lockup - mark plus wordmark for headers and submission materials -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="Recuse Protocol">
  <title>Recuse Protocol</title>

  <!-- Mark on the left -->
  <g transform="translate(0,0)">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#14110F" stroke-width="2"/>
    <rect x="9" y="9" width="46" height="46" fill="none" stroke="#14110F" stroke-width="1"/>
    <text x="32" y="42"
          font-family="'Crimson Pro', 'ITC Charter', Times, serif"
          font-size="32" font-weight="600" font-style="italic"
          text-anchor="middle" fill="#14110F">R</text>
    <line x1="0" y1="32" x2="64" y2="32"
          stroke="#B5252E" stroke-width="3" stroke-linecap="square"/>
  </g>

  <!-- Wordmark on the right -->
  <text x="80" y="38"
        font-family="'Crimson Pro', 'ITC Charter', Times, serif"
        font-size="28" font-weight="500"
        fill="#14110F"
        letter-spacing="-0.5">Recuse</text>
  <text x="80" y="56"
        font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace"
        font-size="10" font-weight="400"
        fill="#8A8580"
        letter-spacing="2.5">PROTOCOL</text>
</svg>
