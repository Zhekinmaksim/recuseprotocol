name: keeper

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: keeper
      - run: npm run tick
        working-directory: keeper
        env:
          GENLAYER_RPC: ${{ secrets.GENLAYER_RPC }}
          ORACLE_ADDRESS: ${{ secrets.ORACLE_ADDRESS }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
